<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everdawn</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>Everdawn <svg class="spark" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <radialGradient id="stHalo"><stop offset="0" stop-color="#fff4c2" stop-opacity=".95"/><stop offset=".25" stop-color="#ffd36b" stop-opacity=".55"/><stop offset=".6" stop-color="#ff9e45" stop-opacity=".16"/><stop offset="1" stop-color="#ff7a3c" stop-opacity="0"/></radialGradient>
            <radialGradient id="stCore"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#fffbe8"/><stop offset=".7" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb54a" stop-opacity="0"/></radialGradient>
            <linearGradient id="stRayV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8c2a" stop-opacity="0"/><stop offset=".3" stop-color="#ffb93d" stop-opacity=".95"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".7" stop-color="#ffb93d" stop-opacity=".95"/><stop offset="1" stop-color="#ff8c2a" stop-opacity="0"/></linearGradient>
            <linearGradient id="stRayH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8c2a" stop-opacity="0"/><stop offset=".3" stop-color="#ffb93d" stop-opacity=".95"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".7" stop-color="#ffb93d" stop-opacity=".95"/><stop offset="1" stop-color="#ff8c2a" stop-opacity="0"/></linearGradient>
            <radialGradient id="stRing"><stop offset=".78" stop-color="#ffffff" stop-opacity="0"/><stop offset=".86" stop-color="#bfe6ff" stop-opacity=".35"/><stop offset=".92" stop-color="#ffd0f0" stop-opacity=".3"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
            <filter id="stBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
          </defs>
          <circle cx="60" cy="60" r="44" fill="url(#stHalo)" filter="url(#stBlur)"/>
          <circle cx="60" cy="60" r="24" fill="url(#stRing)"/>
          <g class="spark-rays">
            <path d="M60 1 L63.6 60 L60 119 L56.4 60 Z" fill="url(#stRayV)"/>
            <path d="M1 60 L60 56.4 L119 60 L60 63.6 Z" fill="url(#stRayH)"/>
            <g transform="rotate(45 60 60)" opacity=".75">
              <path d="M60 20 L62.4 60 L60 100 L57.6 60 Z" fill="url(#stRayV)"/>
              <path d="M20 60 L60 57.6 L100 60 L60 62.4 Z" fill="url(#stRayH)"/>
            </g>
            <g transform="rotate(22.5 60 60)" opacity=".35">
              <path d="M60 34 L60.7 60 L60 86 L59.3 60 Z" fill="url(#stRayV)"/>
              <path d="M34 60 L60 59.3 L86 60 L60 60.7 Z" fill="url(#stRayH)"/>
            </g>
            <g transform="rotate(-22.5 60 60)" opacity=".35">
              <path d="M60 34 L60.7 60 L60 86 L59.3 60 Z" fill="url(#stRayV)"/>
              <path d="M34 60 L60 59.3 L86 60 L60 60.7 Z" fill="url(#stRayH)"/>
            </g>
          </g>
          <circle cx="60" cy="60" r="13" fill="url(#stCore)"/>
          <circle cx="60" cy="60" r="4.2" fill="#ffffff"/>
          <path class="spark-mote m1" d="M95 22 L96 26 L100 27 L96 28 L95 32 L94 28 L90 27 L94 26 Z" fill="#ffc95a"/>
          <path class="spark-mote m2" d="M24 92 L24.8 95.2 L28 96 L24.8 96.8 L24 100 L23.2 96.8 L20 96 L23.2 95.2 Z" fill="#ffb84a"/>
          <circle class="spark-mote m3" cx="92" cy="90" r="1.8" fill="#ffd27a"/>
        </svg></h1>
        <div class="stats">
          <div class="stat"><span id="clock">&#x263C; 6:00 A&middot;M</span><span id="day">Day 1</span></div>
          <div class="mana-wrap">
            <div class="mana"><div class="mana-fill" id="mana"></div><span>Mana</span></div>
            <div class="mana-num" id="manaNum">100 / 100</div>
          </div>
        </div>
      </header>

      <div class="frame">
        <canvas id="game"></canvas>
        <div id="toast" class="toast"></div>
        <div class="hotbar"><div id="hotbarSlots" class="hotbar-slots"></div></div>
      </div>

      <div class="controls">
        <button id="btnAct" type="button">Interact <kbd>E</kbd></button>
        <button id="btnSpell" type="button">Dawn Bloom <kbd>Q</kbd></button>
        <button id="btnBag" type="button">Bag <kbd>I</kbd></button>
        <button id="btnFull" type="button">&#x26F6; Full screen <kbd>F</kbd></button>
      </div>
    </main>

    <!-- three.js r128 and its model loader, then the game. More script files get added below script.js as the game grows -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="script.js"></script>
  </body>
</html>
