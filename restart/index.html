<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everdawn</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>Everdawn <svg class="spark" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="stBloom"><stop offset="0" stop-color="#fffdf4"/><stop offset=".12" stop-color="#fff2c9" stop-opacity=".9"/><stop offset=".3" stop-color="#ffb43c" stop-opacity=".6"/><stop offset=".65" stop-color="#ff8a2a" stop-opacity=".2"/><stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/></radialGradient>
            <radialGradient id="stCore"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffffff"/><stop offset=".7" stop-color="#ffe08a" stop-opacity=".95"/><stop offset="1" stop-color="#ffaa33" stop-opacity="0"/></radialGradient>
            <radialGradient id="stAiry"><stop offset=".8" stop-color="#fff" stop-opacity="0"/><stop offset=".87" stop-color="#5fb4ff" stop-opacity=".45"/><stop offset=".91" stop-color="#ffcf5a" stop-opacity=".6"/><stop offset=".95" stop-color="#ff7ab8" stop-opacity=".4"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <linearGradient id="stW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/><stop offset=".42" stop-color="#ffa62b" stop-opacity="1"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#ffa62b" stop-opacity="1"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></linearGradient><linearGradient id="stWH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a1f" stop-opacity="0"/><stop offset=".42" stop-color="#ffa62b" stop-opacity="1"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#ffa62b" stop-opacity="1"/><stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/></linearGradient>
            <linearGradient id="stB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff" stop-opacity="0"/><stop offset=".42" stop-color="#4fa8ff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#4fa8ff" stop-opacity=".9"/><stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/></linearGradient><linearGradient id="stBH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fd0ff" stop-opacity="0"/><stop offset=".42" stop-color="#4fa8ff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#4fa8ff" stop-opacity=".9"/><stop offset="1" stop-color="#8fd0ff" stop-opacity="0"/></linearGradient>
            <linearGradient id="stR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a6a" stop-opacity="0"/><stop offset=".42" stop-color="#ff5a3a" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#ff5a3a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/></linearGradient><linearGradient id="stRH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a6a" stop-opacity="0"/><stop offset=".42" stop-color="#ff5a3a" stop-opacity=".9"/><stop offset=".5" stop-color="#fff"/><stop offset=".58" stop-color="#ff5a3a" stop-opacity=".9"/><stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/></linearGradient>
            <filter id="stSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
            <filter id="stHaze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
            <filter id="stCrisp" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".45"/></filter>
          </defs>
          <circle cx="100" cy="100" r="70" fill="url(#stBloom)" filter="url(#stSoft)"/>
          <g class="spark-spikes">
            <g filter="url(#stHaze)"><g transform="rotate(0 100 100)" opacity="0.55"><path d="M100 4 L105 100 L100 196 L95 100 Z" fill="url(#stW)"/><path d="M4 100 L100 95 L196 100 L100 105 Z" fill="url(#stWH)"/></g></g>
            <g class="spark-fringe" filter="url(#stCrisp)"><g transform="rotate(0.9 100 100)" opacity="0.55"><path d="M100 12 L101.6 100 L100 188 L98.4 100 Z" fill="url(#stB)"/><path d="M12 100 L100 98.4 L188 100 L100 101.6 Z" fill="url(#stBH)"/></g><g transform="rotate(-0.9 100 100)" opacity="0.5"><path d="M100 12 L101.6 100 L100 188 L98.4 100 Z" fill="url(#stR)"/><path d="M12 100 L100 98.4 L188 100 L100 101.6 Z" fill="url(#stRH)"/></g></g>
            <g filter="url(#stCrisp)"><g transform="rotate(0 100 100)" opacity="1"><path d="M100 2 L101.8 100 L100 198 L98.2 100 Z" fill="url(#stW)"/><path d="M2 100 L100 98.2 L198 100 L100 101.8 Z" fill="url(#stWH)"/></g></g>
            <g filter="url(#stCrisp)"><g transform="rotate(45 100 100)" opacity="0.55"><path d="M100 54 L101.1 100 L100 146 L98.9 100 Z" fill="url(#stW)"/><path d="M54 100 L100 98.9 L146 100 L100 101.1 Z" fill="url(#stWH)"/></g></g>
            <g filter="url(#stCrisp)"><g transform="rotate(22.5 100 100)" opacity="0.35"><path d="M100 74 L100.7 100 L100 126 L99.3 100 Z" fill="url(#stW)"/><path d="M74 100 L100 99.3 L126 100 L100 100.7 Z" fill="url(#stWH)"/></g><g transform="rotate(-22.5 100 100)" opacity="0.35"><path d="M100 74 L100.7 100 L100 126 L99.3 100 Z" fill="url(#stW)"/><path d="M74 100 L100 99.3 L126 100 L100 100.7 Z" fill="url(#stWH)"/></g></g>
          </g>
          <circle cx="100" cy="100" r="25" fill="url(#stAiry)"/>
          <circle cx="100" cy="100" r="36" fill="url(#stAiry)" opacity=".45"/>
          <g class="spark-core">
            <circle cx="100" cy="100" r="17" fill="url(#stCore)" filter="url(#stHaze)"/>
            <circle cx="100" cy="100" r="6.5" fill="#ffffff"/>
          </g>
        </svg></h1>
        <div class="stats">
          <div class="stat"><span id="clock">&#x263C; 6:00 A&middot;M</span><span id="day">Day 1</span></div>
          <div class="mana-wrap">
            <div class="mana"><div class="mana-fill" id="mana"></div><span>Mana</span></div>
            <div class="mana-num" id="manaNum">100 / 100</div>
          </div>
        </div>
      </header>

      <div class="frame">
        <canvas id="game"></canvas>
        <div id="toast" class="toast"></div>
        <div class="hotbar"><div id="hotbarSlots" class="hotbar-slots"></div></div>
      </div>

      <div class="controls">
        <button id="btnAct" type="button">Interact <kbd>E</kbd></button>
        <button id="btnSpell" type="button">Dawn Bloom <kbd>Q</kbd></button>
        <button id="btnBag" type="button">Bag <kbd>I</kbd></button>
        <button id="btnFull" type="button">&#x26F6; Full screen <kbd>F</kbd></button>
      </div>
    </main>

    <!-- three.js r128 and its model loader, then the game. More script files get added below script.js as the game grows -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="script.js"></script>
  </body>
</html>
