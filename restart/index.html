<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everdawn</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>Everdawn <svg class="spark" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="sparkGlow"><stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#ffb64d" stop-opacity="0"/></radialGradient>
            <linearGradient id="sparkFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ffc233"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient>
          </defs>
          <circle cx="50" cy="50" r="30" fill="url(#sparkGlow)"/>
          <path d="M50 22 L54 46 L78 50 L54 54 L50 78 L46 54 L22 50 L46 46 Z" transform="rotate(45 50 50)" fill="#fff1b8" opacity=".85"/>
          <path d="M50 2 C53 36 64 47 98 50 C64 53 53 64 50 98 C47 64 36 53 2 50 C36 47 47 36 50 2 Z" fill="url(#sparkFill)" stroke="#fff8dc" stroke-width="1"/>
          <circle cx="50" cy="50" r="6" fill="#fff"/>
        </svg></h1>
        <div class="stats">
          <div class="stat"><span id="clock">&#x263C; 6:00 A&middot;M</span><span id="day">Day 1</span></div>
          <div class="mana-wrap">
            <div class="mana"><div class="mana-fill" id="mana"></div><span>Mana</span></div>
            <div class="mana-num" id="manaNum">100 / 100</div>
          </div>
        </div>
      </header>

      <div class="frame">
        <canvas id="game"></canvas>
        <div id="toast" class="toast"></div>
        <div class="hotbar"><div id="hotbarSlots" class="hotbar-slots"></div></div>
      </div>

      <div class="controls">
        <button id="btnAct" type="button">Interact <kbd>E</kbd></button>
        <button id="btnSpell" type="button">Dawn Bloom <kbd>Q</kbd></button>
        <button id="btnBag" type="button">Bag <kbd>I</kbd></button>
        <button id="btnFull" type="button">&#x26F6; Full screen <kbd>F</kbd></button>
      </div>
    </main>

    <!-- three.js r128 and its model loader, then the game. More script files get added below script.js as the game grows -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="script.js"></script>
  </body>
</html>
