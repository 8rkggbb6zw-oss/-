<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everdawn</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>Everdawn <svg class="spark" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <radialGradient id="stBloom"><stop offset="0" stop-color="#fffef2"/><stop offset=".15" stop-color="#fff7b8" stop-opacity=".95"/><stop offset=".35" stop-color="#ffe45c" stop-opacity=".55"/><stop offset=".7" stop-color="#ffd23f" stop-opacity=".15"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
            <radialGradient id="stCore"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".75" stop-color="#fff59a" stop-opacity=".95"/><stop offset="1" stop-color="#ffe14d" stop-opacity="0"/></radialGradient>
            <linearGradient id="stGlowV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe14d" stop-opacity="0"/><stop offset=".4" stop-color="#ffe866" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".6" stop-color="#ffe866" stop-opacity=".9"/><stop offset="1" stop-color="#ffe14d" stop-opacity="0"/></linearGradient><linearGradient id="stGlowH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe14d" stop-opacity="0"/><stop offset=".4" stop-color="#ffe866" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".6" stop-color="#ffe866" stop-opacity=".9"/><stop offset="1" stop-color="#ffe14d" stop-opacity="0"/></linearGradient>
            <linearGradient id="stLineV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0" stop-opacity="0"/><stop offset=".4" stop-color="#fffbe0" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".6" stop-color="#fffbe0" stop-opacity=".9"/><stop offset="1" stop-color="#fff3a0" stop-opacity="0"/></linearGradient><linearGradient id="stLineH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff3a0" stop-opacity="0"/><stop offset=".4" stop-color="#fffbe0" stop-opacity=".9"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".6" stop-color="#fffbe0" stop-opacity=".9"/><stop offset="1" stop-color="#fff3a0" stop-opacity="0"/></linearGradient>
            <filter id="stSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
            <filter id="stHaze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
            <filter id="stFine" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".6"/></filter>
          </defs>
          <circle cx="100" cy="100" r="66" fill="url(#stBloom)" filter="url(#stSoft)"/>
          <g class="spark-spikes">
            <g transform="rotate(0 100 100)" opacity="0.85" filter="url(#stHaze)"><path d="M100 4 L107 100 L100 196 L93 100 Z" fill="url(#stGlowV)"/><path d="M4 100 L100 93 L196 100 L100 107 Z" fill="url(#stGlowH)"/></g>
            <g transform="rotate(0 100 100)" opacity="1" filter="url(#stFine)"><path d="M100 2 L101.6 100 L100 198 L98.4 100 Z" fill="url(#stLineV)"/><path d="M2 100 L100 98.4 L198 100 L100 101.6 Z" fill="url(#stLineH)"/></g>
            <g transform="rotate(45 100 100)" opacity="0.6" filter="url(#stHaze)"><path d="M100 48 L104 100 L100 152 L96 100 Z" fill="url(#stGlowV)"/><path d="M48 100 L100 96 L152 100 L100 104 Z" fill="url(#stGlowH)"/></g>
            <g transform="rotate(45 100 100)" opacity="0.8" filter="url(#stFine)"><path d="M100 50 L101 100 L100 150 L99 100 Z" fill="url(#stLineV)"/><path d="M50 100 L100 99 L150 100 L100 101 Z" fill="url(#stLineH)"/></g>
          </g>
          <g class="spark-core">
            <circle cx="100" cy="100" r="18" fill="url(#stCore)" filter="url(#stHaze)"/>
            <circle cx="100" cy="100" r="6" fill="#ffffff"/>
          </g>
        </svg></h1>
        <div class="stats">
          <div class="stat"><span id="clock">&#x263C; 6:00 A&middot;M</span><span id="day">Day 1</span></div>
          <div class="mana-wrap">
            <div class="mana"><div class="mana-fill" id="mana"></div><span>Mana</span></div>
            <div class="mana-num" id="manaNum">100 / 100</div>
          </div>
        </div>
      </header>

      <div class="frame">
        <canvas id="game"></canvas>
        <div id="toast" class="toast"></div>
        <div class="hotbar"><div id="hotbarSlots" class="hotbar-slots"></div></div>
      </div>

      <div class="controls">
        <button id="btnAct" type="button">Interact <kbd>E</kbd></button>
        <button id="btnSpell" type="button">Dawn Bloom <kbd>Q</kbd></button>
        <button id="btnBag" type="button">Bag <kbd>I</kbd></button>
        <button id="btnFull" type="button">&#x26F6; Full screen <kbd>F</kbd></button>
      </div>
    </main>

    <!-- three.js r128 and its model loader, then the game. More script files get added below script.js as the game grows -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="script.js"></script>
  </body>
</html>
