<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everdawn</title>
  </head>
  <body>

    <main class="shell">
      <header class="topbar">
        <h1>Everdawn <span class="spark">✦</span></h1>
        <div class="stats">
          <div class="stat" title="Moonblooms harvested">🌸 <b id="harvest">0</b></div>
          <div class="stat" id="clock">☼ Dawn</div>
          <div class="mana" title="Mana">
            <div class="mana-fill" id="mana"></div>
            <span>Mana</span>
          </div>
        </div>
      </header>

      <div class="frame">
        <canvas id="game"></canvas>
        <div id="toast" class="toast"></div>
      </div>

      <div class="controls">
        <button id="btnAct" type="button">Interact <kbd>E</kbd></button>
        <button id="btnSpell" type="button">Dawn Bloom <kbd>Q</kbd></button>
      </div>

      <p class="help">
        Click the game once, then: <b>WASD / Arrows</b> to moveㆍ<b>E / Space</b> to till, plant, water &amp; harvestㆍ
        <b>Q</b> casts Dawn Bloom (waters every crop)ㆍ<b>Drag</b> to orbit the camera, <b>Scroll</b> to zoomㆍVisit the glowing tree to refill mana.
      </p>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
